<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aplikacja karaoke z wyszukiwaniem piosenek i odtwarzaczem">
  <title>Karaoke | Śpiewaj po swojemu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/filters.css">
  <link rel="stylesheet" href="css/recommendations.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="./" aria-label="Karaoke - strona główna">
        <span class="brand-mark" aria-hidden="true">♪</span>
        <span>Karaoke</span>
      </a>
      <span class="header-note"><span class="live-dot" aria-hidden="true"></span> Twój głos. Twój moment.</span>
    </div>
  </header>

  <main class="container">
    <section id="library-view" class="library-view" aria-labelledby="library-title">
      <div class="hero-layout">
        <div class="intro">
          <p class="eyebrow">Biblioteka utworów / scena otwarta</p>
          <h1 id="library-title">Wybierz coś<br><span>do zaśpiewania.</span></h1>
          <p class="intro-copy">Znajdź piosenkę, złap rytm i przejmij mikrofon.</p>
        </div>
        <div class="hero-note" aria-hidden="true">
          <span>♫</span>
          <small>LIVE<br>SESSION</small>
        </div>
      </div>

      <label class="search-box" for="song-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <span class="sr-only">Szukaj piosenki lub wykonawcy</span>
        <input id="song-search" type="search" placeholder="Szukaj piosenki lub wykonawcy..." autocomplete="off" aria-label="Szukaj piosenki lub wykonawcy">
      </label>

      <section class="filters-panel" aria-labelledby="filters-title">
        <h2 id="filters-title" class="filters-title">Dopasuj repertuar</h2>
        <div class="filters-grid">
          <label class="filter-field" for="genre-filter">
            <span>Gatunek</span>
            <select id="genre-filter" aria-label="Filtruj według gatunku"></select>
          </label>
          <label class="filter-field" for="language-filter">
            <span>Język</span>
            <select id="language-filter" aria-label="Filtruj według języka"></select>
          </label>
          <label class="filter-field" for="decade-filter">
            <span>Dekada</span>
            <select id="decade-filter" aria-label="Filtruj według dekady"></select>
          </label>
          <button id="reset-filters" class="reset-filters" type="button" disabled>Wyczyść filtry</button>
        </div>
      </section>

      <div id="recommendations" class="recommendations" aria-label="Polecane i popularne piosenki"></div>

      <div class="list-heading">
        <h2>Wszystkie piosenki</h2>
        <span id="song-count" class="song-count" aria-live="polite"></span>
      </div>
      <div id="songs-list" class="songs-list" aria-live="polite"></div>
      <p id="list-status" class="status-message" role="status"></p>
    </section>

    <section id="player-view" class="player-view" hidden aria-labelledby="player-title">
      <button id="back-button" class="back-button" type="button" aria-label="Wróć do listy piosenek">← Wróć do listy</button>
      <div class="player-panel">
        <div class="player-art" aria-hidden="true">♫</div>
        <div class="player-details">
          <p class="eyebrow">Teraz grasz</p>
          <h1 id="player-title">-</h1>
          <p id="player-artist" class="player-artist">-</p>
          <p id="player-error" class="player-error" role="alert"></p>
          <div class="player-controls">
            <div class="transport-controls">
              <button id="seek-back" class="secondary-button" type="button" aria-label="Przewiń 10 sekund do tyłu">−10 s</button>
              <button id="play-button" class="play-button" type="button" aria-label="Odtwórz piosenkę">▶ <span>Play</span></button>
              <button id="seek-forward" class="secondary-button" type="button" aria-label="Przewiń 10 sekund do przodu">+10 s</button>
            </div>
            <div class="timeline">
              <input id="progress-slider" type="range" min="0" max="0" value="0" step="0.01" aria-label="Pozycja w utworze" disabled>
              <div class="time-row"><span id="current-time">00:00</span><span id="duration">00:00</span></div>
            </div>
            <div class="mixer-controls">
              <div class="volume-control">
                <button id="mute-button" class="icon-button" type="button" aria-label="Wycisz dźwięk" aria-pressed="false">🔊</button>
                <input id="volume-slider" type="range" min="0" max="1" value="1" step="0.01" aria-label="Głośność">
              </div>
              <label class="select-control" for="speed-select">
                <span>Tempo</span>
                <select id="speed-select">
                  <option value="0.5">0,5×</option>
                  <option value="0.75">0,75×</option>
                  <option value="1" selected>1×</option>
                  <option value="1.25">1,25×</option>
                  <option value="1.5">1,5×</option>
                </select>
              </label>
              <label class="toggle-control" for="lyrics-follow">
                <input id="lyrics-follow" type="checkbox" checked>
                <span>Śledź tekst</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <section class="lyrics-container" aria-labelledby="lyrics-title">
        <div class="lyrics-heading">
          <h2 id="lyrics-title">Tekst piosenki</h2>
          <span class="lyrics-hint">Kliknij wers, aby przewinąć</span>
        </div>
        <div id="lyrics-display" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
