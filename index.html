<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aplikacja karaoke z wyszukiwaniem piosenek i odtwarzaczem">
  <title>Karaoke | Śpiewaj po swojemu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/filters.css">
  <link rel="stylesheet" href="css/recommendations.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="./" aria-label="Karaoke - strona główna">
        <span class="brand-mark" aria-hidden="true">♪</span>
        <span>Karaoke</span>
      </a>
      <span class="header-note">Twój głos. Twój moment.</span>
    </div>
  </header>

  <main class="container">
    <section id="library-view" class="library-view" aria-labelledby="library-title">
      <div class="intro">
        <p class="eyebrow">Biblioteka utworów</p>
        <h1 id="library-title">Wybierz coś do zaśpiewania</h1>
        <p class="intro-copy">Znajdź piosenkę po tytule lub wykonawcy i zacznij ćwiczyć.</p>
      </div>

      <label class="search-box" for="song-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <span class="sr-only">Szukaj piosenki lub wykonawcy</span>
        <input id="song-search" type="search" placeholder="Szukaj piosenki lub wykonawcy..." autocomplete="off" aria-label="Szukaj piosenki lub wykonawcy">
      </label>

      <section class="filters-panel" aria-labelledby="filters-title">
        <h2 id="filters-title" class="filters-title">Dopasuj repertuar</h2>
        <div class="filters-grid">
          <label class="filter-field" for="genre-filter">
            <span>Gatunek</span>
            <select id="genre-filter" aria-label="Filtruj według gatunku"></select>
          </label>
          <label class="filter-field" for="language-filter">
            <span>Język</span>
            <select id="language-filter" aria-label="Filtruj według języka"></select>
          </label>
          <label class="filter-field" for="decade-filter">
            <span>Dekada</span>
            <select id="decade-filter" aria-label="Filtruj według dekady"></select>
          </label>
          <button id="reset-filters" class="reset-filters" type="button" disabled>Wyczyść filtry</button>
        </div>
      </section>

      <div id="recommendations" class="recommendations" aria-label="Polecane i popularne piosenki"></div>

      <div class="list-heading">
        <h2>Wszystkie piosenki</h2>
        <span id="song-count" class="song-count" aria-live="polite"></span>
      </div>
      <div id="songs-list" class="songs-list" aria-live="polite"></div>
      <p id="list-status" class="status-message" role="status"></p>
    </section>

    <section id="player-view" class="player-view" hidden aria-labelledby="player-title">
      <button id="back-button" class="back-button" type="button" aria-label="Wróć do listy piosenek">← Wróć do listy</button>
      <div class="player-panel">
        <div class="player-art" aria-hidden="true">♫</div>
        <div class="player-details">
          <p class="eyebrow">Teraz grasz</p>
          <h1 id="player-title">-</h1>
          <p id="player-artist" class="player-artist">-</p>
          <p id="player-error" class="player-error" role="alert"></p>
          <div class="player-controls">
            <button id="play-button" class="play-button" type="button" aria-label="Odtwórz piosenkę">▶ <span>Play</span></button>
            <div class="timeline">
              <input id="progress-slider" type="range" min="0" max="0" value="0" step="0.1" aria-label="Pozycja w utworze">
              <div class="time-row"><span id="current-time">00:00</span><span id="duration">00:00</span></div>
            </div>
          </div>
        </div>
      </div>
      <section class="lyrics-container" aria-labelledby="lyrics-title">
        <h2 id="lyrics-title">Tekst piosenki</h2>
        <div id="lyrics-display" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
